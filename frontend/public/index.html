<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a2e4a" />
    <meta
      name="description"
      content="ForeignEdge — Study Abroad Platform for Pakistani Students."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>ForeignEdge — Study Abroad</title>

    <!-- Google Translate -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: "en", autoDisplay: false },
          "google_translate_element",
        );
      }
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
      defer
    ></script>

    <style>
      /* Kill Google top banner completely */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
      }
      body {
        top: 0 !important;
        position: static !important;
      }
      iframe.goog-te-banner-frame {
        display: none !important;
      }

      /* Hide "Google Translate" branding text */
      .goog-te-gadget > span,
      .goog-te-gadget a,
      .goog-te-gadget img {
        display: none !important;
      }
      .goog-te-gadget {
        font-size: 0 !important;
        color: transparent !important;
      }

      /* Style the select dropdown */
      #google_translate_element select {
        font-size: 13px !important;
        font-weight: 600 !important;
        color: #fff !important;
        background: rgba(255, 255, 255, 0.15) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
        border-radius: 8px !important;
        padding: 6px 10px !important;
        cursor: pointer !important;
        outline: none !important;
        max-width: 150px !important;
      }
      #google_translate_element select option {
        color: #1a2e4a !important;
        background: #fff !important;
        font-size: 13px !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Google Translate anchor — moved to navbar by Navbar.js -->
    <div id="google_translate_element"></div>
  </body>
</html>
